# The fixture under core/examples/insecure-config exists to be detected: it
# carries synthetic credentials shaped like real ones so the scanner's own test
# suite can prove it finds them. They have never been valid.
#
# Without this exclusion, push protection blocks the first push of this
# repository and the alert list fills with the tool's own test data.
paths-ignore:
  - 'core/examples/**'
  - 'core/tests/**'
