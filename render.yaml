services:
  - type: web
    name: wardline
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && (cd web && npm install --include=dev && npm run build) && (cd server && npm install --include=dev && npm run build)
    startCommand: cd server && npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
